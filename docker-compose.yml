version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-harvest_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-harvest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harvest_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
