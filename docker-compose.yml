version: "3.9"

services:
  postgres:
    image: postgres:16

    container_name: harvest-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: harvest_tracker
      POSTGRES_USER: harvest_user
      POSTGRES_PASSWORD: harvest_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harvest_user -d harvest_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: