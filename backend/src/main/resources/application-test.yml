server:
  port: 0

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/harvest_tracker?options=-c%20timezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:harvest_user}
    password: ${SPRING_DATASOURCE_PASSWORD:harvest_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: harvest_tracker
    repair-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 0

cors:
  allowed-origins: "*"

logging:
  level:
    root: WARN
    com.harvesttracker: INFO
    org.flywaydb: INFO
