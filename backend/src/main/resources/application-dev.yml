server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/harvest_tracker?options=-c%20timezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:harvest_user}
    password: ${SPRING_DATASOURCE_PASSWORD:harvest_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HarvestTrackerHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    connect-retries: 5

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    root: INFO
    com.harvesttracker: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
