server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/harvest_tracker?options=-c%20timezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:harvest_user}
    password: ${SPRING_DATASOURCE_PASSWORD:harvest_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HarvestTrackerHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: harvest_tracker
    repair-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 0
    connect-retries: 5

cors:
  allowed-origins: "http://localhost:3000,http://localhost:5173"

logging:
  level:
    root: INFO
    com.harvesttracker: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
